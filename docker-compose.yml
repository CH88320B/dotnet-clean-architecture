services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SA_PASSWORD:-Your_strong_password123}
    ports:
      - "1433:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      retries: 10
      start_period: 20s

  api:
    build: .
    environment:
      ConnectionStrings__Default: Server=sqlserver,1433;Database=CleanArch;User Id=sa;Password=${SA_PASSWORD:-Your_strong_password123};TrustServerCertificate=True
      Swagger__Enabled: "true"
    ports:
      - "5080:8080"
    depends_on:
      sqlserver:
        condition: service_healthy
