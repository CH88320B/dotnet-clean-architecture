name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore CleanArch.sln
      - name: Build
        run: dotnet build CleanArch.sln --no-restore -c Release
      - name: Test
        run: dotnet test CleanArch.sln --no-build -c Release --collect:"XPlat Code Coverage" --results-directory ./coverage --logger trx
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: coverage/
          retention-days: 7

  docker:
    name: Docker build
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: cleanarch-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
